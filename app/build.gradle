import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'project-report'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-kapt'
    id 'dev.rikka.tools.refine' version '4.4.0'
}

@SuppressWarnings('unused')
static def getEnv(name) {
    def value = System.getenv(name)
    return (value != null && !value.isEmpty()) ? value : null
}

android {

    compileSdk = 36

    buildFeatures {
        viewBinding = false
        aidl = true
        buildConfig = true
        compose = false
    }

    defaultConfig {
        applicationId "app.simple.inure"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 10723
        versionName "build107.2.3"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resValue "string", "versionName", versionName

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }

        javaCompileOptions {
            ksp {
                arg("room.schemaLocation", "$projectDir/schemas".toString())
            }
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    externalNativeBuild {
        cmake {
            path = "src/main/jni/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            def storeFilePath = getEnv("RELEASE_STORE_FILE")
            def storeFileObj  = storeFilePath != null ? file(storeFilePath) : null

            if (storeFileObj != null && storeFileObj.exists()) {
                storeFile     = storeFileObj
                storePassword = getEnv("RELEASE_STORE_PASSWORD")
                keyAlias      = getEnv("RELEASE_KEY_ALIAS")
                keyPassword   = getEnv("RELEASE_KEY_PASSWORD")
            } else {
                storeFile = null
                logger.error("Keystore not found (RELEASE_STORE_FILE=${storeFilePath}), signing disabled.")
            }
        }
    }

    flavorDimensions.add("version")

    productFlavors {
        github { // GitHub build
            dimension "version"
            if (signingConfigs.release != null && signingConfigs.release.storeFile != null) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }
        }
        debug {
            versionNameSuffix "_debug"
            debuggable true

            minifyEnabled = false
            //noinspection NotShrinkingResources
            shrinkResources = false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }

            if (signingConfigs.release != null && signingConfigs.release.storeFile != null) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    ndkVersion = '29.0.13599879'
    namespace = 'app.simple.inure'

    tasks.register('generateVersionTxt') {
        doLast {
            file("./version.txt").text = android.defaultConfig.versionName
        }
    }

    lint {
        disable 'Instantiatable'
    }

    kotlin {
        compilerOptions {
            freeCompilerArgs.add("-XXLanguage:+PropertyParamAnnotationDefaultTargetMode")
        }
    }
}

dependencies {
    compileOnly project(':stub')

    // Android Tools
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.android.tools.build:apksig:8.13.2'

    // Jar Libs, all included in the libs folder
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Kotlin
    runtimeOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.activity:activity-ktx:1.12.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.dynamicanimation:dynamicanimation-ktx:1.1.0'
    implementation 'androidx.transition:transition-ktx:1.7.0'

    // Google
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.github.bumptech.glide:okhttp3-integration:5.0.5'
    //noinspection KaptUsageInsteadOfKsp
    ksp 'com.github.bumptech.glide:ksp:5.0.5'

    // Toolkit
    implementation 'com.github.Hamza417:renderscript-intrinsics-replacement-toolkit:4ae2409809'

    // Third Party
    implementation 'net.dongliu:apk-parser:2.6.10'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.anggrayudi:storage:2.2.0'
    implementation 'com.github.duanhong169:drawabletoolbox:1.0.7'
    implementation "com.github.AppDevNext:AndroidChart:3.1.0.25"
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'io.github.reandroid:ARSCLib:1.3.8'
    implementation 'io.noties.markwon:core:4.6.2'

    githubImplementation 'com.squareup.okhttp3:okhttp:5.3.2'

    implementation 'dev.spght:encryptedprefs-ktx:1.1.1'

    // root
    def libsuVersion = '6.0.0'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:service:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:nio:${libsuVersion}"

    // Shizuku
    def shizukuVersion = '13.1.5'
    implementation "dev.rikka.shizuku:api:${shizukuVersion}"
    implementation "dev.rikka.shizuku:provider:${shizukuVersion}"

    // Refine
    kapt "dev.rikka.tools.refine:annotation-processor:4.4.0"
    //noinspection GradleDependency
    compileOnly "dev.rikka.tools.refine:annotation:4.4.0"

    // Hidden API
    implementation "dev.rikka.hidden:compat:4.4.0"

    // Room
    implementation 'androidx.room:room-ktx:2.8.4'
    //noinspection KaptUsageInsteadOfKsp
    kapt 'androidx.room:room-compiler:2.8.4'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}

afterEvaluate {
    def isSyncing = System.getProperty("idea.sync.active") == "true"

    if (isSyncing) {
        def fastlaneChangelogDir = file("$rootDir/fastlane/metadata/android/en-US/changelogs")
        def currentVersionCode = android.defaultConfig.versionCode

        if (currentVersionCode == null) {
            println("Error: versionCode is not defined.")
            return
        }

        if (!fastlaneChangelogDir.exists()) {
            println("Warning: Fastlane changelog directory not found at $fastlaneChangelogDir")
            return
        }

        def changelogFiles = fastlaneChangelogDir.listFiles()?.findAll { file ->
            file.isFile() && file.name.endsWith(".txt")
        }

        def latestChangelog = changelogFiles?.max { file ->
            def nameWithoutExt = file.name.replace(".txt", "")
            nameWithoutExt.isInteger() ? nameWithoutExt.toInteger() : -1
        }

        if (latestChangelog != null) {
            def targetFile = new File(fastlaneChangelogDir, "${currentVersionCode}.txt")

            if (!targetFile.exists()) {
                targetFile.bytes = latestChangelog.bytes
                println("Fastlane Changelog Sync Success: " +
                        "Cloned changelog from ${latestChangelog.name} to ${targetFile.name}")
            } else {
                println("Fastlane Changelog Sync Skipped: " +
                        "Target changelog ${targetFile.name} already exists.")
            }
        }
    }
}