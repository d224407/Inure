name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.13599879"
      BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android cmdline-tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Verify NDK
        run: |
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo "NDK ${NDK_VERSION} installed successfully"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Build Release
        run: ./gradlew :app:assembleGithubRelease --no-daemon --scan

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RELEASE_STORE_FILE"

      - name: Upload Gradle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-report
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Inure-release
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error