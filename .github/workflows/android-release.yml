name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "29.0.13599879"
      BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android cmdline-tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Verify NDK
        run: |
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo "NDK ${NDK_VERSION} installed successfully"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build Release
        run: |
          ./gradlew :app:assembleGithubRelease --no-daemon --scan \
            -Dscan.terms-of-use.agree=yes \
            -Dscan.terms-of-use.url="https://gradle.com/help/legal-terms-of-use"

      - name: Upload Gradle build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-report
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore

      - name: Sign APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/github/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Inure-release
          path: ${{ steps.sign.outputs.signedReleaseFile }}
          if-no-files-found: error

          
